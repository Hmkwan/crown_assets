name: Run full test suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (pytest)
        env:
          TESTING: '1'
          REDIS_DISABLED: '1'
        run: |
          pytest -q --junitxml=report.xml || true

      - name: Upload pytest JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml

      - name: Upload pytest logs (last 1MB)
        if: always()
        run: |
          mkdir -p artifacts
          tail -c 1000000 .pytest_cache/v/cache/lastfailed || true
        continue-on-error: true
        # Upload artifacts in next step

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            report.xml
            .pytest_cache/**
            artifacts/**
