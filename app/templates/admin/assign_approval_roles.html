{% extends "base.html" %}

{% block title %}审批角色分配{% endblock %}

{% block content %}
<style>
    .page-header {
        background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
        color: white;
        padding: 2rem;
        border-radius: 12px;
        margin-bottom: 2rem;
    }
    .page-header h1 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 600;
    }
    .user-card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        margin-bottom: 1rem;
        transition: all 0.3s;
    }
    .user-card:hover {
        box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .user-header {
        display: flex;
        align-items: center;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid #e3e6f0;
    }
    .user-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin-right: 1rem;
    }
    .user-info h6 {
        margin: 0;
        font-weight: 600;
    }
    .user-dept {
        font-size: 0.85rem;
        color: #858796;
    }
    .user-body {
        padding: 1rem 1.25rem;
    }
    .role-badge {
        display: inline-flex;
        align-items: center;
        padding: 0.4rem 0.9rem;
        border-radius: 20px;
        font-size: 0.85rem;
        margin: 0.25rem;
        background: #f8f9fc;
        border: 1px solid #e3e6f0;
    }
    .role-badge .icon {
        margin-right: 0.4rem;
        font-size: 1.1rem;
    }
    .role-badge .remove-btn {
        margin-left: 0.5rem;
        cursor: pointer;
        color: #e74a3b;
        font-size: 0.9rem;
    }
    .role-badge .remove-btn:hover {
        color: #c9302c;
    }
    .filter-box {
        background: white;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        margin-bottom: 1.5rem;
    }
</style>

<div class="container-fluid">
    <div class="page-header">
        <h1><i class="fas fa-users-cog"></i> 审批角色分配</h1>
        <p>为用户分配和管理审批角色</p>
    </div>

    <div class="filter-box">
        <div class="row align-items-end">
            <div class="col-md-3">
                <label for="searchUser" class="font-weight-bold">搜索用户</label>
                <input type="text" class="form-control" id="searchUser" placeholder="用户名或姓名">
            </div>
            <div class="col-md-3">
                <label for="filterRole" class="font-weight-bold">筛选角色</label>
                <select class="form-control" id="filterRole">
                    <option value="">全部角色</option>
                    {% for role in roles %}
                    <option value="{{ role.id }}"><i class="fas {{ role.icon }}"></i> {{ role.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary btn-block" onclick="filterUsers()">
                    <i class="fas fa-search"></i> 搜索
                </button>
            </div>
        </div>
    </div>

    <div class="row" id="usersContainer">
        {% for user in users %}
        <div class="col-lg-6 user-item" data-user-id="{{ user.id }}" data-username="{{ user.username }}">
            <div class="user-card">
                <div class="user-header">
                    <div class="user-avatar">
                        {{ user.username[0] }}
                    </div>
                    <div class="user-info">
                        <h6>{{ user.username }}</h6>
                        <div class="user-dept">
                            <i class="fas fa-building"></i> {{ user.get_department_name() }}
                        </div>
                    </div>
                    <button class="btn btn-sm btn-success ml-auto" onclick="showAssignModal({{ user.id }}, '{{ user.username }}')">
                        <i class="fas fa-plus"></i> 分配角色
                    </button>
                </div>
                <div class="user-body">
                    <div class="user-roles-{{ user.id }}">
                        <i class="fas fa-spinner fa-spin"></i> 加载中...
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- 分配角色模态框 -->
<div class="modal fade" id="assignModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%); color: white; padding: 1rem 1.5rem;">
                <h5 class="modal-title" style="font-weight: 600;">
                    <i class="fas fa-user-plus me-2"></i> 分配审批角色
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="color: white; opacity: 1;">
                    <span aria-hidden="true" style="font-size: 1.5rem;">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="assignUserId">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    为用户 <strong id="assignUserName"></strong> 分配角色
                </div>
                
                <div class="form-group">
                    <label class="font-weight-bold">选择角色 *</label>
                    <select class="form-control" id="assignRoleId" required>
                        <option value="">请选择...</option>
                        {% for role in roles %}
                        <option value="{{ role.id }}"><i class="fas {{ role.icon }}"></i> {{ role.name }} (Lv.{{ role.level }})</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="font-weight-bold">生效日期</label>
                            <input type="date" class="form-control" id="assignStartDate">
                            <small class="text-muted">留空表示立即生效</small>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="font-weight-bold">失效日期</label>
                            <input type="date" class="form-control" id="assignEndDate">
                            <small class="text-muted">留空表示永久有效</small>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="font-weight-bold">备注</label>
                    <textarea class="form-control" id="assignNotes" rows="3" placeholder="可选的备注信息"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success" onclick="assignRole()">
                    <i class="fas fa-check"></i> 确认分配
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// 批量加载用户角色，限制并发数
$(document).ready(function() {
    const userItems = $('.user-item').toArray();
    let index = 0;
    const concurrentLimit = 3;  // 同时最多3个请求
    
    function loadNext() {
        if (index >= userItems.length) return;
        
        const batch = userItems.slice(index, index + concurrentLimit);
        index += concurrentLimit;
        
        batch.forEach(item => {
            const userId = $(item).data('user-id');
            loadUserRoles(userId);
        });
        
        setTimeout(loadNext, 200);  // 每批次间隔200ms
    }
    
    loadNext();
});

function loadUserRoles(userId) {
    $.ajax({
        url: `/admin/approval_roles/user/${userId}`,
        method: 'GET',
        timeout: 5000,  // 5秒超时
        success: function(data) {
            if (data.success) {
                let html = '';
                if (data.roles.length > 0) {
                    data.roles.forEach(role => {
                        html += `
                            <div class="role-badge" style="border-color: ${role.role_color || '#e3e6f0'}">
                                <span>${role.role_name}</span>
                                <i class="fas fa-times remove-btn" onclick="revokeRole(${role.assignment_id}, '${role.role_name}', ${userId})"></i>
                            </div>
                        `;
                    });
                } else {
                    html = '<span class="text-muted">暂无审批角色</span>';
                }
                $(`.user-roles-${userId}`).html(html);
            } else {
                $(`.user-roles-${userId}`).html('<span class="text-muted">暂无角色</span>');
            }
        },
        error: function(xhr, status, error) {
            console.error(`加载用户${userId}角色失败:`, status, error);
            $(`.user-roles-${userId}`).html('<span class="text-muted">加载失败</span>');
        }
    });
}

function showAssignModal(userId, userName) {
    $('#assignUserId').val(userId);
    $('#assignUserName').text(userName);
    $('#assignRoleId').val('');
    $('#assignStartDate').val('');
    $('#assignEndDate').val('');
    $('#assignNotes').val('');
    $('#assignModal').modal('show');
}

function assignRole() {
    const userId = $('#assignUserId').val();
    const roleId = $('#assignRoleId').val();
    
    if (!roleId) {
        alert('请选择要分配的角色');
        return;
    }
    
    const data = {
        user_id: parseInt(userId),
        role_id: parseInt(roleId),
        start_date: $('#assignStartDate').val() || null,
        end_date: $('#assignEndDate').val() || null,
        notes: $('#assignNotes').val()
    };
    
    $.ajax({
        url: '/admin/approval_roles/assign/create',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(response) {
            if (response.success) {
                alert(response.message);
                $('#assignModal').modal('hide');
                loadUserRoles(userId);
            } else {
                alert('分配失败: ' + response.error);
            }
        },
        error: function(xhr) {
            const error = xhr.responseJSON ? xhr.responseJSON.error : '未知错误';
            alert('分配失败: ' + error);
        }
    });
}

function revokeRole(assignmentId, roleName, userId) {
    if (!confirm(`确定要撤销角色"${roleName}"吗?`)) {
        return;
    }
    
    $.ajax({
        url: `/admin/approval_roles/assign/${assignmentId}/revoke`,
        method: 'DELETE',
        success: function(response) {
            if (response.success) {
                alert(response.message);
                loadUserRoles(userId);
            } else {
                alert('撤销失败: ' + response.error);
            }
        },
        error: function(xhr) {
            const error = xhr.responseJSON ? xhr.responseJSON.error : '未知错误';
            alert('撤销失败: ' + error);
        }
    });
}

function filterUsers() {
    const searchText = $('#searchUser').val().toLowerCase();
    const filterRoleId = $('#filterRole').val();
    
    $('.user-item').each(function() {
        const username = $(this).data('username').toLowerCase();
        const matchSearch = !searchText || username.includes(searchText);
        
        let matchRole = true;
        if (filterRoleId) {
            // 需要检查此用户是否有此角色
            matchRole = false; // 先设为false,如果找到则设为true
            const userId = $(this).data('user-id');
            $.get(`/admin/approval_roles/user/${userId}`, function(data) {
                if (data.success) {
                    matchRole = data.roles.some(r => r.role_id == filterRoleId);
                    $(this).toggle(matchSearch && matchRole);
                }
            }.bind(this));
        } else {
            $(this).toggle(matchSearch);
        }
    });
}
</script>
{% endblock %}
