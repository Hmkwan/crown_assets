{% extends "base.html" %}

{% block title %}聊天 - 设备管理系统{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/chat_modern.css') }}?v={{ cache_version }}">
{% endblock %}

{% block content %}
<div class="container-fluid mt-2">
    <div class="chat-container">
        <!-- 左侧会话列表 -->
        <div class="chat-sidebar">
            <div class="chat-sidebar-header">
                <h4><i class="fas fa-comments"></i> 聊天</h4>
                <button id="newChatBtn" class="new-chat-btn toolbar-btn" title="新建会话" onclick="showNewChat()">
                    <i class="fas fa-plus"></i><span class="btn-label" style="display:none">新建</span>
                </button>
            </div>
            
            <div class="chat-search">
                <!-- 为兼容旧脚本与 chat.js 统一为 conversationSearch -->
                <input type="text" placeholder="搜索会话..." id="conversationSearch">
            </div>
            
            <div class="conversation-list" id="conversationItems">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p class="mt-2">加载中...</p>
                </div>
            </div>
        </div>
        
        <!-- 右侧聊天区域 -->
        <div class="chat-main" id="chatMain">
            <div class="chat-header" id="chatHeader">
                <!-- 动态渲染会话标题和操作按钮 -->
                <div class="chat-title">请选择会话</div>
                <div class="chat-actions">
                    <button class="chat-action-btn toolbar-btn" id="emojiBtn" title="表情">
                        <i class="fas fa-smile"></i><span class="btn-label" style="display:none">表情</span>
                    </button>
                    <button class="chat-action-btn toolbar-btn" id="fileUploadBtn" title="上传文件">
                        <i class="fas fa-paperclip"></i><span class="btn-label" style="display:none">附件</span>
                    </button>
                    <input type="file" id="fileInput" style="display:none">
                    <button class="chat-action-btn toolbar-btn" id="toggleOnlineUsersBtn" title="在线用户">
                        <i class="fas fa-users"></i><span class="btn-label" style="display:none">在线</span>
                    </button>
                    <button class="chat-action-btn toolbar-btn" id="showInfoBtn" title="会话信息">
                        <i class="fas fa-info-circle"></i><span class="btn-label" style="display:none">信息</span>
                    </button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="chat-empty">
                    <i class="fas fa-comments"></i>
                    <p>选择一个会话开始聊天</p>
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="chatInput" class="form-control" rows="2" placeholder="输入消息后按 Enter 发送"></textarea>
                <button id="sendBtn" class="send-btn btn btn-primary">发送</button>
            </div>
        </div>

        <!-- 会话信息模态框 -->
        <div class="modal fade" id="conversationInfoModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">会话信息</h5>
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                    </div>
                    <div class="modal-body" id="conversationInfoBody">
                        <!-- 通过 JS 填充 -->
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" id="endConversationBtn">结束会话</button>
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 删除确认模态框 -->
        <div class="modal fade" id="confirmDeleteModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">确认删除会话</h5>
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                    </div>
                    <div class="modal-body">删除会话将同时删除所有消息，且不可恢复，确定继续吗？</div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">删除</button>
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧在线用户面板 -->
        <div class="online-users-container">
            <h5>在线用户</h5>
            <button id="fetch-online-users-btn" class="btn btn-sm btn-primary">刷新</button>
            <ul id="online-users-list" class="list-group mt-2">
                <!-- 在线用户动态加载 -->
            </ul>
            <button id="create-conversation-btn" class="btn btn-success btn-sm mt-2">创建会话</button>
        </div>
    </div>
</div>

<!-- 新建会话模态框 -->
<div class="modal fade" id="newChatModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-user-plus"></i> 新建会话</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>选择用户</label>
                    <select class="form-control" id="userSelect">
                        <option value="">正在加载...</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="createConversation()">
                    <i class="fas fa-check"></i> 创建
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Socket.IO 客户端 -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    // 如果 CDN 未能加载 socket.io 客户端（或被浏览器策略阻止），尝试加载本地副本（如果项目有提供）
    (function(){
        function ensureSocketLoaded(){
            if (typeof io === 'undefined'){
                console.warn('socket.io client 未定义，尝试加载本地静态副本');
                var s = document.createElement('script');
                s.src = "{{ url_for('static', filename='vendor/socket.io/socket.io.min.js') }}";
                s.onerror = function(){ console.warn('加载本地 socket.io 失败'); };
                document.head.appendChild(s);
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', ensureSocketLoaded);
        } else { ensureSocketLoaded(); }

        // 在短等待后如果仍然没有 io，则设置标识，让后续初始化能提示用户
        setTimeout(function(){ if (typeof io === 'undefined') { window.__socket_client_missing = true; console.warn('socket.io 客户端未能加载 (CDN & 本地均失败)'); } }, 1500);
    })();
</script>
<!-- 实时通知封装 -->
<script src="{{ url_for('static', filename='js/realtime-notifications.js') }}?v={{ cache_version }}"></script>
<script>
// 兼容性包装：将旧的全局函数映射到新的 chatSystem 实例方法（如果存在）。若 chatSystem 尚未准备就绪，则排队并在就绪后回放。
(function(){
    window.__chat_legacy_queue = window.__chat_legacy_queue || [];
    let __chat_legacy_flush_timer = null;
    function tryFlush() {
        if (window.chatSystem && window.__chat_legacy_queue.length) {
            while (window.__chat_legacy_queue.length) {
                const item = window.__chat_legacy_queue.shift();
                console.debug('[Chat wrapper] replaying legacy call', item.fnName, item.args);
                try { 
                    if (typeof window.chatSystem[item.fnName] === 'function') {
                        window.chatSystem[item.fnName].apply(window.chatSystem, item.args);
                    } else {
                        console.warn('[Chat wrapper] method not found on ChatSystem:', item.fnName);
                    }
                } catch(e) { console.warn('replaying legacy call failed', e); }
            }
            if (__chat_legacy_flush_timer) { clearInterval(__chat_legacy_flush_timer); __chat_legacy_flush_timer = null; }
        }
    }
    __chat_legacy_flush_timer = setInterval(tryFlush, 200);
    // 暴露一个全局清理函数，以便外部（如 ChatSystem）能清除内部的定时器
    window.__chat_legacy_clearTimer = function(){ if (__chat_legacy_flush_timer) { clearInterval(__chat_legacy_flush_timer); __chat_legacy_flush_timer = null; } };
    function wrap(name, fnName) {
        if (typeof window[name] === 'undefined') {
            window[name] = function(){
                try {
                    if (window.chatSystem && typeof window.chatSystem[fnName] === 'function') {
                        return window.chatSystem[fnName].apply(window.chatSystem, arguments);
                    } else {
                        console.warn(`${name} called but chatSystem not ready; queuing call`);
                        const args = Array.prototype.slice.call(arguments);
                        const q = window.__chat_legacy_queue;
                        const last = q.length? q[q.length-1] : null;
                        if (!last || last.fnName !== fnName || JSON.stringify(last.args) !== JSON.stringify(args)) {
                            q.push({ fnName: fnName, args: args });
                        } else {
                            console.debug('[Chat wrapper] skip duplicate queued call', fnName, args);
                        }
                    }
                } catch(e) { console.warn(`${name} wrapper error`, e); }
            };
        }
    }
    wrap('loadConversations', 'loadConversations');
    wrap('selectConversation', 'selectConversation');
    wrap('loadMessages', 'loadMessages');
    wrap('showNewChat', 'showNewChatModal');
})();
</script>
<script src="{{ url_for('static', filename='js/online-users.js') }}"></script>
<!-- 新的 Chat 前端（基于 app/static/js/chat.js） -->
<script>window.currentUserIsAdmin = {{ 'true' if current_user.is_admin() else 'false' }};</script>
<script src="{{ url_for('static', filename='js/chat.js') }}?v={{ cache_version }}"></script>
<script>
    // Legacy inline fragment removed — rendering handled by `app/static/js/chat.js`


// 获取头像字符
function getAvatar(conv) {
    if (conv.type === 'direct' && conv.other_user) {
        return conv.other_user.real_name ? conv.other_user.real_name[0] : conv.other_user.username[0];
    }
    return conv.name ? conv.name[0] : '群';
}

// 获取预览文本
function getPreview(conv) {
    if (conv.last_message) {
        return conv.last_message.content || '暂无消息';
    }
    return '暂无消息';
}

// 格式化时间
function formatTime(timeStr) {
    const date = new Date(timeStr);
    const now = new Date();
    const diff = (now - date) / 1000; // 秒
    
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    
    const month = date.getMonth() + 1;
    const day = date.getDate();
    return `${month}/${day}`;
}

// 选择会话
let joinedConversationId = null;
function selectConversation(id) {
    // Prefer chatSystem implementation when available
    if (window.chatSystem && typeof window.chatSystem.selectConversation === 'function') {
        try {
            return window.chatSystem.selectConversation(id);
        } catch (e) { console.warn('chatSystem.selectConversation error', e); }
    }

    // Legacy fallback: only run if legacy 'conversations' array exists
    if (typeof conversations === 'undefined') {
        console.warn('selectConversation called but legacy conversations not available; will defer to chatSystemReady or queue');
        console.debug('selectConversation status:', {
            chatSystemExists: !!window.chatSystem,
            chatSystemHasSelect: !!(window.chatSystem && typeof window.chatSystem.selectConversation === 'function'),
            legacyQueueLen: (window.__chat_legacy_queue || []).length
        });

        // 如果 chatSystem 已存在但旧的 conversations 变量没有定义，直接委托给 chatSystem.selectConversation
        if (window.chatSystem && typeof window.chatSystem.selectConversation === 'function') {
            try {
                console.debug('Delegating selectConversation to chatSystem immediately', id);
                window.chatSystem.selectConversation(id);
                return;
            } catch (e) { console.warn('chatSystem.selectConversation immediate delegation failed', e); }
        }

        // 否则在 chatSystemReady 事件到达时尝试一次委托
        const onReady = function() {
            try {
                if (window.chatSystem && typeof window.chatSystem.selectConversation === 'function') {
                    console.debug('Deferred selectConversation on chatSystemReady', id);
                    window.chatSystem.selectConversation(id);
                    return;
                }
            } catch (e) { console.warn('Deferred chatSystem.selectConversation failed', e); }
        };
        window.addEventListener('chatSystemReady', onReady, { once: true });

        // 超时回退到 legacy queue（以保证最终会有重试）
        setTimeout(function(){
            if (!(window.chatSystem && typeof window.chatSystem.selectConversation === 'function')) {
                console.warn('chatSystem did not become ready in time; queueing legacy selectConversation', id);
                window.__chat_legacy_queue = window.__chat_legacy_queue || [];
                window.__chat_legacy_queue.push({ fnName: 'selectConversation', args: [id] });
            }
        }, 5000);

        return;
    }

    const conv = conversations.find(c => c.id === id);
    if (!conv) return;

    // 如果之前已加入另一个会话房间，先离开
    try {
        if (joinedConversationId && window.RealtimeNotification) {
            window.RealtimeNotification.send('leave_conversation', { conversation_id: joinedConversationId });
        }
    } catch (e) { console.warn('leave_conversation failed', e); }

    // 获取会话详情以便获得参与者角色等信息
    $.get(`/api/chat/conversations/${id}`, function(resp){
        const convDetail = resp.conversation || conv;
        // 标记当前用户是否能编辑群名
        const selfPart = (convDetail.participants || []).find(p => p.id === currentUserId);
        convDetail._can_edit_name = (convDetail.type === 'group') && (selfPart && (selfPart.role === 'owner' || selfPart.role === 'admin'));

        currentConversation = convDetail;
        window.currentConversation = currentConversation; // expose to global for realtime handlers
        // 将会话在本地会话列表里更新
        const idx = conversations.findIndex(c => c.id === id);
        if (idx !== -1) conversations[idx] = convDetail;

        renderConversations();
        renderChatArea(convDetail);
        loadMessages(id);

        // 加入会话房间以接收实时消息
        try {
            if (window.RealtimeNotification) {
                window.RealtimeNotification.send('join_conversation', { conversation_id: id });
                joinedConversationId = id;
            }
        } catch (e) { console.warn('join_conversation failed', e); }
    }).fail(function(xhr){
        console.error('[Chat] 获取会话详情失败:', xhr.status);
    });
}

// 渲染聊天区域
function renderChatArea(conv) {
    window.currentConversation = conv || window.currentConversation; // ensure global reference
    const name = conv.name || '未命名会话';
    const participants = conv.type === 'group' ? `${conv.participant_count}人` : '';
    
    // 编辑群名按钮（仅群聊且有权限时显示: 需要在 selectConversation 时读取当前用户的 role）
    const editBtn = (conv.type === 'group' && conv._can_edit_name) ? `<button title="编辑群名" onclick="editGroupName()"><i class="fas fa-edit"></i></button>` : '';

    const html = `
        <div class="chat-header">
            <div class="chat-header-info">
                <h5 id="chatTitle">${escapeHtml(name)}</h5>
                <div class="chat-header-meta">${participants}</div>
            </div>
            <div class="chat-actions">
                <button title="会话信息"><i class="fas fa-info-circle"></i></button>
                ${editBtn}
                <button title="更多"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessagesWrapper">
            <div class="load-more-container text-center"><button id="loadMoreBtn" class="btn btn-sm btn-outline-secondary" onclick="loadOlderMessages()">加载历史</button></div>
            <div id="chatMessages" class="chat-messages-inner"></div>
        </div>
        <div class="chat-input-area">
            <div class="input-toolbar">
                <button title="表情"><i class="fas fa-smile"></i></button>
                <button title="附件" onclick="openFilePicker(false)"><i class="fas fa-paperclip"></i></button>
                <button title="图片" onclick="openFilePicker(true)"><i class="fas fa-image"></i></button>
                <button title="发送流程" onclick="openWorkflowModal()"><i class="fas fa-tasks"></i></button>
            </div>

            <!-- 流程模态框 -->
            <div class="modal fade" id="workflowModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title"><i class="fas fa-tasks"></i> 选择审批模板</h5>
                            <button type="button" class="close" data-dismiss="modal">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label>模板</label>
                                <select class="form-control" id="workflowTemplateSelect">
                                    <option value="">正在加载...</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                            <button type="button" class="btn btn-primary" onclick="sendWorkflowFromChat()">发送流程</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="attachment-previews" id="attachmentPreviews"></div>
            <div class="input-wrapper">
                <textarea id="messageInput" rows="2" placeholder="输入消息... (Ctrl+Enter发送)" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i> 发送
                </button>
            </div>
        </div>

        <input type="file" id="hiddenFileInput" style="display:none;" multiple />
    `;
    
    $('#chatMain').html(html);

    // 绑定文件选择
    $('#hiddenFileInput').off('change').on('change', function(e){
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        handleFileUpload(files);
        // 清空 input
        $(this).val('');
    });
}

// 打开文件选择器
function openFilePicker(acceptImage){
    const input = document.getElementById('hiddenFileInput');
    if (acceptImage) {
        input.accept = 'image/*';
    } else {
        input.accept = '';
    }
    input.click();
}

// 待上传的附件数组
let pendingAttachments = [];

function handleFileUpload(files){
    if (!currentConversation) {
        alert('请先选择会话');
        return;
    }

    files.forEach(file => {
        uploadAttachment(file).then(att => {
            pendingAttachments.push(att);
            renderAttachmentPreviews();
        }).catch(err => {
            console.error('上传失败', err);
            alert('上传失败: ' + (err.error || '网络错误'));
        });
    });
}

function renderAttachmentPreviews(){
    const $p = $('#attachmentPreviews');
    if (pendingAttachments.length === 0) {
        $p.html('');
        return;
    }
    const html = pendingAttachments.map(att => {
        if (att.is_image) {
            return `<div class="att-preview"><img src='${att.thumbnail_url || att.download_url}' alt='${escapeHtml(att.filename)}'><button class='remove-att' data-id='${att.id}' onclick='removePendingAttachment(${att.id})'>✕</button></div>`
        }
        return `<div class="att-preview"><i class='fas fa-file'></i><div class='att-name'>${escapeHtml(att.filename)}</div><button class='remove-att' data-id='${att.id}' onclick='removePendingAttachment(${att.id})'>✕</button></div>`
    }).join('');
    $p.html(html);
}

function removePendingAttachment(id){
    pendingAttachments = pendingAttachments.filter(a => a.id !== id);
    renderAttachmentPreviews();
}

// 编辑群名
function editGroupName(){
    if (!currentConversation || currentConversation.type !== 'group') return;
    const newName = prompt('输入新的群名称', currentConversation.name || '');
    if (newName === null) return; // 取消
    if (newName.trim() === '') { alert('群名不能为空'); return; }

    $.ajax({
        url: `/api/chat/conversations/${currentConversation.id}`,
        method: 'PATCH',
        contentType: 'application/json',
        data: JSON.stringify({ name: newName.trim() }),
        success: function(resp){
            currentConversation.name = resp.conversation.name;
            $('#chatTitle').text(currentConversation.name);
            // 更新会话列表
            loadConversations();
        },
        error: function(xhr){
            alert('修改失败: ' + (xhr.responseJSON?.error || '未知错误'));
        }
    });
}


// 加载消息
function loadMessages(conversationId) {
    console.log('[Chat] 加载会话', conversationId, '的消息');
    $.get(`/api/chat/conversations/${conversationId}/messages`, function(data) {
        messages = data.messages || [];
        console.log('[Chat] 收到', messages.length, '条消息');
        renderMessages();
        scrollToBottom();
    }).fail(function(xhr) {
        console.error('[Chat] 加载消息失败:', xhr.status);
    });
}

// 向上加载更早的消息（分页）
function loadOlderMessages() {
    if (!currentConversation || messages.length === 0) return;
    const firstMessageId = messages[0].id;
    const convId = currentConversation.id;
    $.get(`/api/chat/conversations/${convId}/messages`, { before_id: firstMessageId, per_page: 30 }, function(data) {
        const older = data.messages || [];
        if (older.length === 0) {
            $('#loadMoreBtn').prop('disabled', true).text('没有更多消息');
            return;
        }
        // 在前面拼接老消息
        messages = older.concat(messages);
        renderMessages(true);
    }).fail(function(xhr) {
        console.error('[Chat] 加载历史失败:', xhr.status);
    });
}

// 渲染消息
function renderMessages(prepend=false) {
    const $messages = $('#chatMessages');
    if (!$messages.length) return;
    
    if (messages.length === 0) {
        $messages.html('<div class="empty-state"><i class="fas fa-inbox"></i><p>暂无消息</p></div>');
        return;
    }
    
    const html = messages.map(msg => {
        const isOwn = msg.sender_id === currentUserId;
        const avatar = msg.sender_name ? msg.sender_name[0] : '?';
        const content = msg.is_recalled ? '<i class="text-muted">[消息已撤回]</i>' : escapeHtml(msg.content);
        const time = formatTime(msg.created_date);

        // 渲染附件
        let attHtml = '';
        if (msg.attachments && msg.attachments.length) {
            attHtml = '<div class="message-attachments">' + msg.attachments.map(att => {
                if (att.is_image || (att.file_type && att.file_type.startsWith('image/'))) {
                    const thumb = att.thumbnail_url || att.download_url || `/static/uploads/chat/${att.filename}`;
                    return `<div class='att-image'><a href='${att.download_url || thumb}' target='_blank'><img src='${thumb}' alt='${escapeHtml(att.filename)}' /></a></div>`;
                }
                return `<div class='att-file'><a href='${att.download_url}' target='_blank'><i class='fas fa-file'></i> ${escapeHtml(att.filename)}</a></div>`;
            }).join('') + '</div>';
        }
        
        return `
        <div class="message ${isOwn ? 'own' : ''}">
            <div class="message-avatar">${avatar}</div>
            <div class="message-content">
                ${!isOwn ? `<div class="message-sender">${escapeHtml(msg.sender_name)}</div>` : ''}
                <div class="message-bubble">${content}</div>
                ${attHtml}
                <div class="message-time">${time}</div>
            </div>
        </div>`;
    }).join('');
    
    if (prepend) {
        // 保持滚动位置, 将老消息插到上方
        const $inner = $('#chatMessages');
        const prevScrollHeight = $inner.prop('scrollHeight');
        $inner.html(html);
        const newScrollHeight = $inner.prop('scrollHeight');
        $inner.scrollTop(newScrollHeight - prevScrollHeight);
    } else {
        $messages.html(html);
    }
}

// 上传单个附件, 返回 attachment 对象
function uploadAttachment(file) {
    return new Promise(function(resolve, reject){
        const form = new FormData();
        form.append('file', file);
        form.append('conversation_id', currentConversation.id);

        $.ajax({
            url: '/api/chat/attachments',
            method: 'POST',
            data: form,
            processData: false,
            contentType: false,
            success: function(resp){
                if (resp && resp.attachment) {
                    // 规范返回字段
                    const att = resp.attachment;
                    att.is_image = att.file_type && att.file_type.startsWith('image/');
                    att.download_url = att.download_url || `/api/chat/attachments/${resp.attachment_id}/download`;
                    att.thumbnail_url = att.thumbnail_url;
                    resolve(att);
                } else {
                    reject({error: '上传失败'});
                }
            },
            error: function(xhr){
                reject(xhr.responseJSON || {error: '上传失败'});
            }
        });
    });
}

// 发送消息
function sendMessage() {
    if (!currentConversation) return;
    
    const $input = $('#messageInput');
    const content = $input.val().trim();
    // 如果没有文字但有附件, 允许发送
    if (!content && pendingAttachments.length === 0) return;
    
    console.log('[Chat] 发送消息:', content);
    
    const attachment_ids = pendingAttachments.map(a => a.id);

    $.ajax({
        url: '/api/chat/messages',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            conversation_id: currentConversation.id,
            content: content,
            message_type: 'text',
            attachment_ids: attachment_ids
        }),
        success: function(data) {
            console.log('[Chat] 消息已发送');
            $input.val('');
            pendingAttachments = [];
            renderAttachmentPreviews();
            loadMessages(currentConversation.id);
        },
        error: function(xhr) {
            console.error('[Chat] 发送失败:', xhr.status);
            alert('发送失败: ' + (xhr.responseJSON?.error || '未知错误'));
        }
    });
}

// 键盘事件
function handleKeyDown(e) {
    if (e.ctrlKey && e.keyCode === 13) {
        sendMessage();
    }
}

// 显示新建会话
function showNewChat() {
    console.log('[Chat] 打开新建会话');
    $.get('/api/chat/users', function(data) {
        const options = data.users.map(u => 
            `<option value="${u.id}">${u.real_name || u.username} (${u.department})</option>`
        ).join('');
        $('#userSelect').html(options);
        $('#newChatModal').modal('show');
    });
}

// 打开流程选择模态
function openWorkflowModal(){
    if (!currentConversation) { alert('请先选择会话'); return; }
    $('#workflowTemplateSelect').html('<option value="">加载中...</option>');
    $.get('/api/chat/workflow_templates', function(resp){
        const opts = (resp.templates || []).map(t => `<option value="${t.id}">${t.name}</option>`).join('');
        $('#workflowTemplateSelect').html(opts || '<option value="">无可用模板</option>');
        $('#workflowModal').modal('show');
    }).fail(function(xhr){
        alert('加载模板失败');
    });
}

// 从会话中发送流程请求
function sendWorkflowFromChat(){
    const tid = $('#workflowTemplateSelect').val();
    if (!tid) { alert('请选择模板'); return; }
    if (!currentConversation) { alert('请先选择会话'); return; }

    $.ajax({
        url: '/api/chat/start_workflow',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ conversation_id: currentConversation.id, template_id: parseInt(tid) }),
        success: function(resp){
            $('#workflowModal').modal('hide');
            // 已在后端生成系统消息并广播; 刷新消息列表
            loadMessages(currentConversation.id);
            loadConversations();
            alert('流程已发起');
        },
        error: function(xhr){
            alert('发起失败: ' + (xhr.responseJSON?.message || '未知错误'));
        }
    });
}

// 创建会话
function createConversation() {
    const userId = $('#userSelect').val();
    if (!userId) {
        alert('请选择用户');
        return;
    }
    
    console.log('[Chat] 创建与用户', userId, '的会话');
    
    const payload = { type: 'direct', participant_ids: [parseInt(userId)] };
    console.debug('[Chat] 创建会话 payload:', payload);
    // 防止重复点击
    $('#createBtn').prop('disabled', true).text('创建中...');
    $.ajax({
        url: '/api/chat/conversations',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(payload),
        success: function(data) {
            console.log('[Chat] 会话已创建:', data.conversation.id);
            $('#newChatModal').modal('hide');
            loadConversations();
            if (data.conversation) {
                // 乐观更新：把新会话加入本地会话数组以便立即可见
                try {
                    if (window.chatSystem && Array.isArray(window.chatSystem.conversations)) {
                        const exists = window.chatSystem.conversations.find(c => c.id === data.conversation.id);
                        if (!exists) {
                            window.chatSystem.conversations.unshift(data.conversation);
                            try { window.chatSystem.renderConversations(); } catch(e) { console.warn('renderConversations failed after optimistic push', e); }
                        }
                    }
                } catch(e){ console.warn('optimistic update failed', e); }

                // 使用 Promise 来确保 chatSystem 已就绪; 超时回退到 legacy
                if (window.__chat_wait_for_chatSystem) {
                    window.__chat_wait_for_chatSystem(7000).then(() => {
                        try { window.chatSystem.selectConversation(data.conversation.id); } catch(e) { console.warn('chatSystem.selectConversation failed (after wait)', e); selectConversation(data.conversation.id); }
                    }).catch(() => {
                        console.warn('chatSystem not ready after wait; attempting immediate chatSystem call before falling back');
                        try {
                            if (window.chatSystem && typeof window.chatSystem.selectConversation === 'function') {
                                window.chatSystem.selectConversation(data.conversation.id);
                                return;
                            }
                        } catch (e) { console.warn('immediate chatSystem.selectConversation after wait failed', e); }
                        if (typeof selectConversation === 'function') {
                            selectConversation(data.conversation.id);
                        } else {
                            window.__chat_legacy_queue = window.__chat_legacy_queue || [];
                            window.__chat_legacy_queue.push({ fnName: 'selectConversation', args: [data.conversation.id] });
                        }
                    });
                } else {
                    if (window.chatSystem && typeof window.chatSystem.selectConversation === 'function') {
                        try { window.chatSystem.selectConversation(data.conversation.id); } catch(e) { console.warn('chatSystem.selectConversation failed', e); }
                    } else if (typeof selectConversation === 'function') {
                        setTimeout(() => selectConversation(data.conversation.id), 500);
                    } else {
                        window.__chat_legacy_queue = window.__chat_legacy_queue || [];
                        window.__chat_legacy_queue.push({ fnName: 'selectConversation', args: [data.conversation.id] });
                    }
                }
            }
        },
        error: function(xhr) {
            console.error('[Chat] 创建会话失败', xhr.status, xhr.responseText);
            let errMsg = '未知错误';
            try {
                const j = JSON.parse(xhr.responseText || '{}');
                errMsg = j.error || j.message || errMsg;
            } catch(e) {}
            alert('创建失败: ' + errMsg + ' (状态:' + xhr.status + ')');
        },
        complete: function() {
            $('#createBtn').prop('disabled', false).text('创建');
        }
    });
}

// 滚动到底部
function scrollToBottom() {
    setTimeout(() => {
        const $messages = $('#chatMessages');
        if ($messages.length) {
            $messages.scrollTop($messages[0].scrollHeight);
        }
    }, 100);
}

// HTML转义
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
