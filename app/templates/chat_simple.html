{% extends "base.html" %}

{% block title %}聊天 - 设备管理系统{% endblock %}

{% block head %}
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
{% endblock %}

{% block extra_css %}
<style>
    .chat-container { display: flex; height: calc(100vh - 120px); }
    .chat-sidebar { width: 300px; border-right: 1px solid #ddd; background: #f8f9fa; }
    .chat-main { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 15px; border-bottom: 1px solid #ddd; background: white; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; background: #e5ddd5; }
    .chat-input { padding: 15px; border-top: 1px solid #ddd; background: white; }
    
    .conversation-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #e0e0e0; }
    .conversation-item:hover { background: #e3f2fd; }
    .conversation-item.active { background: #2196F3; color: white; }
    
    .message { margin-bottom: 15px; }
    .message.sent { text-align: right; }
    .message-bubble { display: inline-block; padding: 10px 15px; border-radius: 18px; max-width: 70%; }
    .message.received .message-bubble { background: white; }
    .message.sent .message-bubble { background: #dcf8c6; }
    .message-time { font-size: 11px; color: #999; margin-top: 5px; }
    
    .empty-state { text-align: center; padding: 60px 20px; color: #999; }
    .loading { text-align: center; padding: 20px; color: #666; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid mt-3">
    <div class="chat-container">
        <!-- 左侧会话列表 -->
        <div class="chat-sidebar">
            <div class="p-3 border-bottom">
                <button class="btn btn-primary btn-block" onclick="showNewChat()">
                    <i class="fas fa-plus"></i> 新建会话
                </button>
            </div>
            <div id="conversationList">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> 加载中...
                </div>
            </div>
        </div>
        
        <!-- 右侧聊天区域 -->
        <div class="chat-main">
            <div class="chat-header" id="chatHeader">
                <div class="empty-state">
                    <i class="fas fa-comments fa-3x text-muted mb-3"></i>
                    <h5>选择一个会话开始聊天</h5>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <!-- 消息列表 -->
            </div>
            
            <div class="chat-input" id="chatInput" style="display: none;">
                <div class="input-group">
                    <input type="text" class="form-control" id="messageInput" 
                           placeholder="输入消息... (Enter发送)" onkeypress="handleKeyPress(event)">
                    <div class="input-group-append">
                        <button class="btn btn-primary" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i> 发送
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 新建会话模态框 -->
<div class="modal fade" id="newChatModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新建会话</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>选择用户</label>
                    <select class="form-control" id="userSelect">
                        <option value="">正在加载...</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="createConversation()">创建</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentConversation = null;
let currentUserId = {{ current_user.id }};
let conversations = [];
let messages = [];
let pollingInterval = null;

// 页面加载完成
$(document).ready(function() {
    loadConversations();
    // 每5秒刷新一次会话列表
    setInterval(loadConversations, 5000);

    // 兼容性包装：将旧的全局函数映射到新的 chatSystem 实例方法（如果存在）。若 chatSystem 尚未准备就绪，则排队并在就绪后回放。
    (function(){
        window.__chat_legacy_queue = window.__chat_legacy_queue || [];
        let __chat_legacy_flush_timer = null;
        function tryFlush() {
            if (window.chatSystem && window.__chat_legacy_queue.length) {
                while (window.__chat_legacy_queue.length) {
                    const item = window.__chat_legacy_queue.shift();
                    try { window.chatSystem[item.fnName].apply(window.chatSystem, item.args); } catch(e) { console.warn('replaying legacy call failed', e); }
                }
                if (__chat_legacy_flush_timer) { clearInterval(__chat_legacy_flush_timer); __chat_legacy_flush_timer = null; }
            }
        }
        __chat_legacy_flush_timer = setInterval(tryFlush, 200);
        // 暴露清理函数
        window.__chat_legacy_clearTimer = function(){ if (__chat_legacy_flush_timer) { clearInterval(__chat_legacy_flush_timer); __chat_legacy_flush_timer = null; } };
        function wrap(name, fnName) {
            if (typeof window[name] === 'undefined') {
                window[name] = function(){
                    try {
                        if (window.chatSystem && typeof window.chatSystem[fnName] === 'function') {
                            return window.chatSystem[fnName].apply(window.chatSystem, arguments);
                        } else {
                            console.warn(`${name} called but chatSystem not ready; queuing call`);
                            const args = Array.prototype.slice.call(arguments);
                            const q = window.__chat_legacy_queue;
                            const last = q.length? q[q.length-1] : null;
                            if (!last || last.fnName !== fnName || JSON.stringify(last.args) !== JSON.stringify(args)) {
                                q.push({ fnName: fnName, args: args });
                            } else {
                                console.debug('[Chat wrapper] skip duplicate queued call', fnName, args);
                            }
                        }
                    } catch(e) { console.warn(`${name} wrapper error`, e); }
                };
            }
        }
        wrap('loadConversations', 'loadConversations');
        wrap('selectConversation', 'selectConversation');
        wrap('loadMessages', 'loadMessages');
        wrap('showNewChat', 'showNewChatModal');
    })();
});

// 加载会话列表
function loadConversations() {
    console.log('[Chat] 开始加载会话列表...');
    $.get('/api/chat/conversations', function(data) {
        console.log('[Chat] API响应:', data);
        conversations = data.conversations || [];
        console.log('[Chat] 会话数量:', conversations.length);
        renderConversations();
    }).fail(function(xhr) {
        console.error('[Chat] 加载会话失败:', xhr.status, xhr.responseText);
        if (xhr.status === 401 || xhr.status === 302) {
            console.warn('[Chat] 未授权,重定向到登录页');
            window.location.href = '/auth/login';
        }
    });
}

// 渲染会话列表
function renderConversations() {
    console.log('[Chat] 开始渲染会话列表, 会话数:', conversations.length);
    
    const html = conversations.length === 0 
        ? '<div class="empty-state"><i class="fas fa-inbox"></i><p class="mt-2">暂无会话</p></div>'
        : conversations.map((conv, index) => {
            console.log(`[Chat] 渲染会话 ${index+1}:`, conv);
            const name = conv.name || '未命名会话';
            const lastMsg = conv.last_message ? conv.last_message.content : '暂无消息';
            return `
            <div class="conversation-item ${currentConversation && currentConversation.id === conv.id ? 'active' : ''}"
                 onclick="selectConversation(${conv.id})">
                <div><strong>${escapeHtml(name)}</strong></div>
                <div class="text-muted small">${escapeHtml(lastMsg)}</div>
            </div>`;
        }).join('');
    
    console.log('[Chat] HTML长度:', html.length);
    $('#conversationList').html(html);
    console.log('[Chat] 渲染完成');
}

// 选择会话
function selectConversation(id) {
    const conv = conversations.find(c => c.id === id);
    if (!conv) return;
    
    currentConversation = conv;
    renderConversations();
    
    $('#chatHeader').html(`<h5>${escapeHtml(conv.name || '会话')}</h5>`);
    $('#chatInput').show();
    
    loadMessages(id);
    
    // 停止旧的轮询
    if (pollingInterval) clearInterval(pollingInterval);
    // 每3秒轮询新消息
    pollingInterval = setInterval(() => loadMessages(id), 3000);
}

// 加载消息
function loadMessages(conversationId) {
    $.get(`/api/chat/conversations/${conversationId}/messages`, function(data) {
        messages = data.messages || [];
        renderMessages();
        scrollToBottom();
    }).fail(function(xhr) {
        console.error('加载消息失败:', xhr);
    });
}

// 渲染消息
function renderMessages() {
    if (messages.length === 0) {
        $('#chatMessages').html('<div class="empty-state"><i class="fas fa-comment-slash"></i><p>暂无消息</p></div>');
        return;
    }
    
    const html = messages.map(msg => {
        const isSent = msg.sender_id === currentUserId;
        const time = new Date(msg.created_date).toLocaleString('zh-CN', {
            month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        });
        
        return `
            <div class="message ${isSent ? 'sent' : 'received'}">
                ${!isSent ? `<div class="text-muted small mb-1">${escapeHtml(msg.sender_name || '未知')}</div>` : ''}
                <div class="message-bubble">${escapeHtml(msg.content)}</div>
                <div class="message-time">${time}</div>
            </div>
        `;
    }).join('');
    
    $('#chatMessages').html(html);
}

// 滚动到底部
function scrollToBottom() {
    const elem = document.getElementById('chatMessages');
    if (elem) elem.scrollTop = elem.scrollHeight;
}

// 发送消息
function sendMessage() {
    if (!currentConversation) return;
    
    const input = $('#messageInput');
    const content = input.val().trim();
    if (!content) return;
    
    $.ajax({
        url: '/api/chat/messages',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            conversation_id: currentConversation.id,
            content: content,
            message_type: 'text'
        }),
        success: function() {
            input.val('');
            loadMessages(currentConversation.id);
        },
        error: function(xhr) {
            alert('发送失败: ' + (xhr.responseJSON?.error || '未知错误'));
        }
    });
}

// Enter发送
function handleKeyPress(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
}

// 显示新建会话
function showNewChat() {
    $.get('/api/chat/users', function(data) {
        const options = data.users.map(u => 
            `<option value="${u.id}">${escapeHtml(u.real_name || u.username)} (${escapeHtml(u.department)})</option>`
        ).join('');
        $('#userSelect').html(options);
        $('#newChatModal').modal('show');
    }).fail(function(xhr) {
        alert('加载用户列表失败');
    });
}

// 创建会话
function createConversation() {
    const userId = $('#userSelect').val();
    if (!userId) return;
    
    $.ajax({
        url: '/api/chat/conversations',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            type: 'direct',
            participant_ids: [parseInt(userId)]
        }),
        success: function(data) {
            $('#newChatModal').modal('hide');
            loadConversations();
            if (data.conversation) {
                // 乐观更新：在 chatSystem 中插入新会话以便立即可见
                try {
                    if (window.chatSystem && Array.isArray(window.chatSystem.conversations)) {
                        if (!window.chatSystem.conversations.find(c => c.id === data.conversation.id)) {
                            window.chatSystem.conversations.unshift(data.conversation);
                            try { window.chatSystem.renderConversations(); } catch(e) { console.warn('renderConversations failed after optimistic push', e); }
                        }
                    }
                } catch(e) { console.warn('optimistic update failed', e); }

                // Use promise-based wait for chatSystem readiness; fallback to legacy if timeout
                if (window.__chat_wait_for_chatSystem) {
                    window.__chat_wait_for_chatSystem(7000).then(() => {
                        try { window.chatSystem.selectConversation(data.conversation.id); } catch(e) { console.warn('chatSystem.selectConversation failed (after wait)', e); selectConversation(data.conversation.id); }
                    }).catch(() => {
                        console.warn('chatSystem not ready after wait; attempting immediate chatSystem call before falling back');
                        try {
                            if (window.chatSystem && typeof window.chatSystem.selectConversation === 'function') {
                                window.chatSystem.selectConversation(data.conversation.id);
                                return;
                            }
                        } catch (e) { console.warn('immediate chatSystem.selectConversation after wait failed', e); }
                        setTimeout(() => selectConversation(data.conversation.id), 500);
                    });
                } else {
                    if (window.chatSystem && typeof window.chatSystem.selectConversation === 'function') {
                        try { window.chatSystem.selectConversation(data.conversation.id); } catch(e) { console.warn('chatSystem.selectConversation failed', e); }
                    } else if (typeof selectConversation === 'function') {
                        setTimeout(() => selectConversation(data.conversation.id), 500);
                    } else {
                        window.__chat_legacy_queue = window.__chat_legacy_queue || [];
                        window.__chat_legacy_queue.push({ fnName: 'selectConversation', args: [data.conversation.id] });
                    }
                }
            }
        },
        error: function(xhr) {
            alert('创建失败: ' + (xhr.responseJSON?.error || '未知错误'));
        }
    });
}

// HTML转义
function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return (text || '').replace(/[&<>"']/g, m => map[m]);
}
</script>
{% endblock %}
