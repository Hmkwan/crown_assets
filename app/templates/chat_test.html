{% extends "base.html" %}

{% block title %}API测试 - 聊天系统{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>聊天API测试页面</h2>
    
    <div class="card mt-4">
        <div class="card-header">
            <h5>当前用户信息</h5>
        </div>
        <div class="card-body">
            <p><strong>用户名:</strong> {{ current_user.username }}</p>
            <p><strong>用户ID:</strong> {{ current_user.id }}</p>
        </div>
    </div>
    
    <div class="card mt-4">
        <div class="card-header">
            <h5>API测试结果</h5>
        </div>
        <div class="card-body">
            <button class="btn btn-primary" onclick="testConversationsAPI()">测试会话API</button>
            <button class="btn btn-success ml-2" onclick="testUsersAPI()">测试用户API</button>
            <hr>
            <pre id="result" style="background: #f5f5f5; padding: 15px; min-height: 200px;">点击按钮测试API...</pre>
        </div>
    </div>
</div>

<script>
function testConversationsAPI() {
    const result = document.getElementById('result');
    result.textContent = '正在请求 /api/chat/conversations...\n';
    
    fetch('/api/chat/conversations', {
        credentials: 'same-origin'
    })
    .then(response => {
        result.textContent += `状态码: ${response.status}\n`;
        result.textContent += `Content-Type: ${response.headers.get('Content-Type')}\n\n`;
        return response.json();
    })
    .then(data => {
        result.textContent += 'JSON数据:\n';
        result.textContent += JSON.stringify(data, null, 2);
    })
    .catch(error => {
        result.textContent += '错误: ' + error;
    });
}

function testUsersAPI() {
    const result = document.getElementById('result');
    result.textContent = '正在请求 /api/chat/users...\n';
    
    fetch('/api/chat/users', {
        credentials: 'same-origin'
    })
    .then(response => {
        result.textContent += `状态码: ${response.status}\n`;
        result.textContent += `Content-Type: ${response.headers.get('Content-Type')}\n\n`;
        return response.json();
    })
    .then(data => {
        result.textContent += 'JSON数据:\n';
        result.textContent += JSON.stringify(data, null, 2);
    })
    .catch(error => {
        result.textContent += '错误: ' + error;
    });
}
</script>
{% endblock %}
