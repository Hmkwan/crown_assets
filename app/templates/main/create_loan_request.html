{% extends "base.html" %}

{% block content %}
<div class="container">
  <h1>申请借用设备</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
      <label class="form-label">选择设备</label>
      <select name="equipment_id" class="form-control">
        <option value="">请选择设备</option>
        {% for e in equipments %}
        <option value="{{ e.id }}">{{ e.name }} ({{ e.department }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">开始日期与时间</label>
        <input type="datetime-local" name="start_date" class="form-control">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">结束日期与时间</label>
        <input type="datetime-local" name="end_date" class="form-control">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">备注</label>
      <textarea name="notes" class="form-control" rows="3"></textarea>
    </div>

    <button class="btn btn-primary" type="submit">提交借用申请</button>
  </form>
</div>
{% endblock %}
