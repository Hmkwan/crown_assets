{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="fas fa-edit"></i> 编辑角色信息</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">角色名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="name" required 
                                   value="{{ role.name }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">角色描述</label>
                            <textarea class="form-control" name="description" rows="3">{{ role.description or '' }}</textarea>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="is_active" id="is_active"
                                       {% if role.is_active %}checked{% endif %}>
                                <label class="form-check-label" for="is_active">
                                    启用该角色
                                </label>
                            </div>
                            <small class="text-muted">禁用后,拥有该角色的用户将无法使用该角色的权限</small>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('main.role_permission_management') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> 返回
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 保存
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
