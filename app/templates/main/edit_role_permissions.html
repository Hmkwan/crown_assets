{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="mb-4">
        <h2><i class="fas fa-key"></i> 配置权限 - {{ role.name }}</h2>
        <p class="text-muted">为角色分配具体的模块访问和操作权限</p>
    </div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card">
            <div class="card-body">
                <table class="table table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 200px;">模块</th>
                            <th>权限</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for module_key, module_info in available_modules.items() %}
                        <tr>
                            <td><strong>{{ module_info.name }}</strong></td>
                            <td>
                                <div class="d-flex flex-wrap gap-3">
                                    {% for action in module_info.actions %}
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" 
                                               name="{{ module_key }}_{{ action }}" 
                                               id="{{ module_key }}_{{ action }}"
                                               {% if current_permissions.get(module_key ~ '_' ~ action) %}checked{% endif %}>
                                        <label class="form-check-label" for="{{ module_key }}_{{ action }}">
                                            {{ action_names.get(action, action) }}
                                        </label>
                                    </div>
                                    {% endfor %}
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3 d-flex justify-content-between">
            <a href="{{ url_for('main.role_permission_management') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> 返回
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> 保存权限配置
            </button>
        </div>
    </form>
</div>

<style>
.gap-3 > * {
    margin-right: 1rem;
    margin-bottom: 0.5rem;
}
</style>
{% endblock %}
