{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="mb-4">
        <h2><i class="fas fa-users"></i> 分配用户 - {{ role.name }}</h2>
        <p class="text-muted">选择拥有该角色的用户</p>
    </div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <span>选择用户 (已选择: <strong id="selected-count">{{ assigned_user_ids|length }}</strong>)</span>
                    <div>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="selectAll()">全选</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="unselectAll()">全不选</button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    {% for user in all_users %}
                    <div class="col-md-6 col-lg-4 col-xl-3 mb-3">
                        <div class="form-check">
                            <input class="form-check-input user-checkbox" type="checkbox" 
                                   name="user_ids" value="{{ user.id }}" 
                                   id="user_{{ user.id }}"
                                   {% if user.id in assigned_user_ids %}checked{% endif %}
                                   onchange="updateCount()">
                            <label class="form-check-label" for="user_{{ user.id }}">
                                <strong>{{ user.username }}</strong>
                                <br>
                                <small class="text-muted">
                                    {{ user.get_role_display() }} - {{ user.get_department_name() or '无部门' }}
                                </small>
                            </label>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                {% if not all_users %}
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i> 没有可分配的用户
                </div>
                {% endif %}
            </div>
        </div>

        <div class="mt-3 d-flex justify-content-between">
            <a href="{{ url_for('main.role_permission_management') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> 返回
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> 保存分配
            </button>
        </div>
    </form>
</div>

<script>
function selectAll() {
    document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = true);
    updateCount();
}

function unselectAll() {
    document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = false);
    updateCount();
}

function updateCount() {
    const count = document.querySelectorAll('.user-checkbox:checked').length;
    document.getElementById('selected-count').textContent = count;
}
</script>
{% endblock %}
