{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h1>{{ title }}</h1>
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    {% if current_user.role != 'user' %}
                    <a href="{{ url_for('main.create_repair_order') }}" class="btn btn-primary">创建维修工单</a>
                    {% endif %}
                </div>
                <div>
                    <!-- 筛选按钮 -->
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-secondary filter-btn" data-filter="all">全部</button>
                        <button type="button" class="btn btn-outline-secondary filter-btn" data-filter="submitted">已提交</button>
                        <button type="button" class="btn btn-outline-secondary filter-btn" data-filter="in_progress">处理中</button>
                        <button type="button" class="btn btn-outline-secondary filter-btn" data-filter="completed">已完成</button>
                        <button type="button" class="btn btn-outline-secondary filter-btn" data-filter="cancelled">已取消</button>
                    </div>
                </div>
            </div>
            
            <!-- 工单列表 -->
            <div id="orders-container">
                {% include 'main/repair_orders_table.html' %}
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function() {
        $('.filter-btn').click(function() {
            var filterType = $(this).data('filter');
            
            // 更新按钮样式
            $('.filter-btn').removeClass('btn-secondary').addClass('btn-outline-secondary');
            $(this).removeClass('btn-outline-secondary').addClass('btn-secondary');
            
            // 发送请求获取筛选后的数据
            $.get('{{ url_for("main.repair_orders") }}', {filter: filterType}, function(data) {
                $('#orders-container').html(data);
            });
        });
    });
    
    // 删除工单
    function deleteOrder(orderId) {
        if (confirm('确定要删除这个维修工单吗？此操作不可恢复！')) {
            fetch(`/repair_orders/${orderId}/delete`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    location.reload();
                } else {
                    alert('错误: ' + data.message);
                }
            })
            .catch(error => {
                alert('请求失败: ' + error);
            });
        }
    }
    
    // 将函数暴露到全局作用域
    window.deleteOrder = deleteOrder;
</script>
{% endblock %}
