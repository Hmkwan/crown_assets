<!DOCTYPE html>
<html>
<head>
    <title>按钮测试</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>按钮点击测试</h2>
        
        <div class="card mt-3">
            <div class="card-body">
                <h5>测试1: 直接绑定按钮</h5>
                <button class="btn btn-primary test-btn-1">
                    <i class="fas fa-edit"></i> 直接绑定按钮
                </button>
                <div class="alert alert-info mt-2" id="result-1" style="display:none;">按钮被点击了！</div>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-body">
                <h5>测试2: 事件委托按钮</h5>
                <button class="btn btn-success test-btn-2 edit-node" data-id="123">
                    <i class="fas fa-edit"></i> 事件委托按钮
                </button>
                <div class="alert alert-success mt-2" id="result-2" style="display:none;">事件委托成功！</div>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-body">
                <h5>测试3: 打开模态框</h5>
                <button class="btn btn-warning" data-toggle="modal" data-target="#testModal">
                    <i class="fas fa-window-maximize"></i> data-toggle方式
                </button>
                <button class="btn btn-info test-btn-3">
                    <i class="fas fa-window-maximize"></i> JavaScript方式
                </button>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-body">
                <h5>控制台日志</h5>
                <div id="console-output" class="border p-3 bg-light" style="max-height: 300px; overflow-y: auto;">
                    <div>页面加载完成...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 测试模态框 -->
    <div class="modal fade" id="testModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">测试模态框</h5>
                    <button type="button" class="close text-white" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>✅ 模态框成功打开！</p>
                    <p>jQuery版本: <span id="jquery-version"></span></p>
                    <p>Bootstrap版本: 4.6.2</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery 1.12.4 (与你的系统一致) -->
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <!-- Bootstrap 4.6.2 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function log(msg) {
            const output = document.getElementById('console-output');
            const div = document.createElement('div');
            div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
            console.log(msg);
        }

        $(document).ready(function() {
            log('=== jQuery Ready 完成 ===');
            log('jQuery 版本: ' + $.fn.jquery);
            $('#jquery-version').text($.fn.jquery);
            
            log('按钮数量: ' + $('.test-btn-1').length);
            log('edit-node按钮数量: ' + $('.edit-node').length);

            // 测试1: 直接绑定
            $('.test-btn-1').click(function() {
                log('测试1: 直接绑定按钮被点击');
                $('#result-1').show();
            });

            // 测试2: 事件委托
            $(document).on('click', '.edit-node', function(e) {
                e.preventDefault();
                const id = $(this).data('id');
                log('测试2: 事件委托按钮被点击, ID=' + id);
                $('#result-2').show();
            });

            // 测试3: JavaScript打开模态框
            $('.test-btn-3').click(function() {
                log('测试3: 使用JavaScript打开模态框');
                $('#testModal').modal('show');
            });

            // 监听模态框事件
            $('#testModal').on('show.bs.modal', function() {
                log('模态框即将显示');
            });

            $('#testModal').on('shown.bs.modal', function() {
                log('✅ 模态框已成功显示');
            });

            log('所有事件绑定完成');
        });
    </script>
</body>
</html>
