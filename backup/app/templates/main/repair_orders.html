{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1>维修工单</h1>
                {% if current_user.role != 'admin' and current_user.role != 'technician' %}
                <a href="{{ url_for('main.create_repair_order') }}" class="btn btn-primary">新建工单</a>
                {% endif %}
            </div>

            <!-- 筛选按钮 -->
            <div class="mb-3">
                <button class="btn btn-outline-secondary filter-btn" data-filter="all">全部</button>
                <button class="btn btn-outline-secondary filter-btn" data-filter="today">今日</button>
                <button class="btn btn-outline-secondary filter-btn" data-filter="week">本周</button>
                <button class="btn btn-outline-secondary filter-btn" data-filter="month">本月</button>
            </div>

            <!-- 工单表格 -->
            <div id="orders-container">
                {% include 'main/repair_orders_table.html' %}
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function() {
        $('.filter-btn').click(function() {
            var filterType = $(this).data('filter');
            
            // 更新按钮样式
            $('.filter-btn').removeClass('btn-secondary').addClass('btn-outline-secondary');
            $(this).removeClass('btn-outline-secondary').addClass('btn-secondary');
            
            // 发送请求获取筛选后的数据
            $.get('{{ url_for("main.filter_repair_orders") }}', {type: filterType}, function(data) {
                $('#orders-container').html(data);
            });
        });
    });
</script>
{% endblock %}
