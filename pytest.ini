[pytest]
filterwarnings =
    ignore::DeprecationWarning:werkzeug.routing
    ignore::DeprecationWarning:ast
    ignore::flask_sqlalchemy.FSADeprecationWarning
    # Suppress third-party deprecation noise we can't fix yet
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning:openpyxl.packaging.core
    ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated.*:DeprecationWarning:sqlalchemy.sql.sqltypes
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning:sqlalchemy.sql.schema
