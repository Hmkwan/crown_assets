    <script>
        // 将 CSRF token 暴露到全局并为 jQuery/fetch 请求自动注入 header
        (function() {
            try {
                window.CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            } catch (e) {
                window.CSRF_TOKEN = '';
            }

            if (window.jQuery) {
                $.ajaxSetup({
                    beforeSend: function(xhr, settings) {
                        if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type)) {
                            xhr.setRequestHeader('X-CSRFToken', window.CSRF_TOKEN);
                            xhr.setRequestHeader('X-CSRF-Token', window.CSRF_TOKEN);
                        }
                    }
                });
            }

            // 包装 fetch，自动在非安全方法中注入 CSRF header
            if (window.fetch) {
                const _oldFetch = window.fetch.bind(window);
                window.fetch = function(input, init) {
                    init = init || {};
                    init.headers = init.headers || {};
                    const method = (init.method || 'GET').toUpperCase();
                    if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(method)) {
                        init.headers['X-CSRFToken'] = window.CSRF_TOKEN;
                        init.headers['X-CSRF-Token'] = window.CSRF_TOKEN;
                    }
                    return _oldFetch(input, init);
                };
            }
        })();
    </script>

    <script>
      // 流程查询功能
      (function(){
        const typeSelect = document.getElementById('wfType');
        const orderSelect = document.getElementById('wfOrderSelect');
        const orderSelectGroup = document.getElementById('wfOrderSelectGroup');
        const loadingIndicator = document.getElementById('wfLoadingIndicator');
        const emptyMessage = document.getElementById('wfEmptyMessage');
        const goBtn = document.getElementById('wfGo');
        
        // 监听流程类型变化
        if(typeSelect){
          typeSelect.addEventListener('change', function(){
            const type = this.value;
            
            // 重置
            orderSelect.innerHTML = '<option value="">加载中...</option>';
            orderSelectGroup.style.display = 'none';
            loadingIndicator.style.display = 'none';
            emptyMessage.style.display = 'none';
            goBtn.disabled = true;
            
            if(!type){
              orderSelect.innerHTML = '<option value="">请先选择流程类型</option>';
              return;
            }
            
            // 显示加载指示器
            loadingIndicator.style.display = 'block';
            
            // 获取工单列表
            fetch('/api/my-workflow-orders?type=' + type)
              .then(function(response){ return response.json(); })
              .then(function(data){
                loadingIndicator.style.display = 'none';
                
                if(data.success && data.data && data.data.length > 0){
                  orderSelect.innerHTML = '';
                  data.data.forEach(function(order){
                    const option = document.createElement('option');
                    option.value = order.id;
                    option.textContent = order.label;
                    if(order.is_my_approval){
                      option.style.fontWeight = 'bold';
                      option.style.color = '#dc3545';
                    }
                    orderSelect.appendChild(option);
                  });
                  orderSelectGroup.style.display = 'block';
                } else {
                  orderSelect.innerHTML = '<option value="">暂无相关工单</option>';
                  emptyMessage.style.display = 'block';
                }
              })
              .catch(function(error){
                loadingIndicator.style.display = 'none';
                orderSelect.innerHTML = '<option value="">加载失败,请重试</option>';
                console.error('加载工单列表失败:', error);
              });
          });
        }
        
        // 监听工单选择变化
        if(orderSelect){
          orderSelect.addEventListener('change', function(){
            goBtn.disabled = !this.value;
          });
        }
        
        // 查看按钮点击
        if(goBtn){
          goBtn.addEventListener('click', function(){
            const type = typeSelect.value;
            const id = orderSelect.value;
            
            if(!type){
              alert('请选择流程类型');
              return;
            }
            if(!id){
              alert('请选择工单');
              return;
            }
            
            window.location.href = '/workflow/status/' + type + '/' + id;
          });
        }
      })();
    </script>
